spring.application.name=base

server.port = 8000
spring.datasource.url=jdbc:mysql://localhost:3306/learn_english?useSSL=false
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# App Properties
bezkoder.app.jwtSecret= ======================BezKoder=Spring===========================
bezkoder.app.jwtExpirationMs=864000000

# Mail Properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=your-email@gmail.com

# Frontend base URL, used to redirect back after the Zalo OAuth flow
app.frontend.url=http://localhost:3000

# Zalo OA (free OA Message API) - fill these in after creating your Official Account
# and registering an app at https://developers.zalo.me
zalo.oa.appId=
zalo.oa.secretKey=
zalo.oa.followUrl=https://zalo.me/YOUR_OA_ID
zalo.oa.redirectUri=http://localhost:8000/api/zalo/oauth/callback

# Discord Incoming Webhook - leave empty to disable Discord notifications
discord.webhookUrl=