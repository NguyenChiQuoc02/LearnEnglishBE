spring.application.name=base

server.port=${PORT:8000}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learn_english?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Redis cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.cache.type=redis
cache.ttl.seconds=600

# MinIO object storage (run `docker compose up -d` in the repo root to start it locally)
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=learn-english

# Uploads (images/videos/office docs) need more room than Spring Boot's 1MB default
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# App Properties
bezkoder.app.jwtSecret=${JWT_SECRET:}
bezkoder.app.jwtExpirationMs=864000000

# Mail Properties
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}

# Frontend base URL, used to redirect back after the Zalo OAuth flow
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Zalo OA (free OA Message API) - fill these in after creating your Official Account
# and registering an app at https://developers.zalo.me
zalo.oa.appId=${ZALO_OA_APP_ID:}
zalo.oa.secretKey=${ZALO_OA_SECRET_KEY:}
zalo.oa.followUrl=${ZALO_OA_FOLLOW_URL:https://zalo.me/YOUR_OA_ID}
zalo.oa.redirectUri=${ZALO_OA_REDIRECT_URI:http://localhost:8000/api/zalo/oauth/callback}

# Google Sign-In - OAuth 2.0 Client ID (Web application) from
# https://console.cloud.google.com/apis/credentials. Must match the client ID used
# by the frontend's Google Identity Services button (NEXT_PUBLIC_GOOGLE_CLIENT_ID).
google.oauth.clientId=${GOOGLE_OAUTH_CLIENT_ID:}

# Discord Incoming Webhook - leave empty to disable Discord notifications
discord.webhookUrl=${DISCORD_WEBHOOK_URL:}

# MoMo (sandbox test-merchant credentials from MoMo's public developer docs — replace with your own for real use)
momo.partnerCode=${MOMO_PARTNER_CODE:}
momo.accessKey=${MOMO_ACCESS_KEY:}
momo.secretKey=${MOMO_SECRET_KEY:}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.ipnUrl=${MOMO_IPN_URL:http://localhost:8000/api/payments/momo/ipn}
momo.redirectUrl=${MOMO_REDIRECT_URL:http://localhost:3000/wallet}